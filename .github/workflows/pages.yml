name: Publish book PDF to Pages

on:
  push:
    branches: [main]
    paths:
      - integral-book.pdf
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the published book
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare the PDF and reading page
        run: |
          test -s integral-book.pdf
          install -Dm644 integral-book.pdf _site/integral-book.pdf
          install -Dm644 index.html _site/index.html

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
